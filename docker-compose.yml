version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bd_tech_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bd_tech_ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - solusation-network

  redis:
    image: redis:7-alpine
    container_name: bd_tech_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - solusation-network

  typesense:
    image: typesense/typesense:27.1
    container_name: bd_tech_typesense
    restart: unless-stopped
    ports:
      - "8108:8108"
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-solusation_dev_typesense_key_2026}
      TYPESENSE_ENABLE_CORS: "true"
    volumes:
      - typesense_data:/data
    networks:
      - solusation-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  typesense_data:
    driver: local

networks:
  solusation-network:
    driver: bridge
